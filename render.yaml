services:
  # Spring Boot Backend — Docker runtime (Render has no native Java runtime)
  - type: web
    name: cloud-strategy-simulator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVER_PORT
        value: 8080
    healthCheckPath: /actuator/health

  # React Frontend — static site
  - type: web
    name: cloud-strategy-simulator-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cloud-strategy-simulator-api
          property: host
