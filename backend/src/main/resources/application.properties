# ── Server ───────────────────────────────────────────────────────────────
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── H2 (dev / default profile) ───────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cloudscale;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 console enabled only in dev — disabled in prod profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Actuator ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Cloud Strategy Simulator
info.app.version=1.0.0

# ── JWT (override in prod!) ───────────────────────────────────────────────
app.jwt.secret=dev-secret-key-must-be-32chars-minimum!!
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── CORS (dev) ────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── Logging ───────────────────────────────────────────────────────────────
logging.level.com.major.cloud=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
